version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ludo_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ludo_admin
      MONGO_INITDB_ROOT_PASSWORD: ludo_password_2026
      MONGO_INITDB_DATABASE: ludo_legends
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: ludo_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
